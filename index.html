:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#251f19;--fg:#f1e7d8;--muted:#ab9a82;--line:#42362a;--accent:#e58f73;--soft:#33291f;--onacc:#1b1612;--guide:#6d5b46;--tint:#d9b98a}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#251f19;--fg:#f1e7d8;--muted:#ab9a82;--line:#42362a;--accent:#e58f73;--soft:#33291f;--onacc:#1b1612;--guide:#6d5b46;--tint:#d9b98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--accent);color:var(--onacc);padding:12px 14px 12px}
h1{margin:0 0 10px;font-size:19px;line-height:1.25;font-weight:700;text-align:center}
#q{width:100%;padding:11px 14px;border:0;border-radius:24px;font:inherit;font-size:16px;background:var(--card);color:var(--fg)}
#q::placeholder{color:var(--muted)}
.wrap{max-width:960px;margin:0 auto;padding:12px 12px 40px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.tree{padding:1px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:6px;width:fit-content;flex-shrink:0;min-height:0;padding:2px 8px;line-height:1.3;border:1px solid var(--line);border-radius:8px;margin:9px 0;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.row:active{background:var(--soft)}
.mk{flex:none;width:10px;color:var(--accent);font-size:14px;text-align:center}
.num{flex:none;color:var(--accent);font-weight:700;font-size:13px}
.nm{flex:1;white-space:nowrap}
.nm small{display:block;color:var(--muted);font-size:13px}
.bd{flex:none;background:var(--soft);color:var(--muted);border-radius:8px;padding:0 6px;font-size:13px}
.kids{display:none}
.tn>.row{background:hsl(var(--h) 50% 90%);border-color:hsl(var(--h) 38% 72%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tn>.row{background:hsl(var(--h) 32% 22%);border-color:hsl(var(--h) 28% 38%)}}
:root[data-theme="dark"] .tn>.row{background:hsl(var(--h) 32% 22%);border-color:hsl(var(--h) 28% 38%)}
.tn>.row:active{filter:brightness(.93)}
.kids.in{margin-left:var(--step,15px);padding-left:5px;border-left:1px dashed var(--guide)}
.nt{display:block;font-size:14px;color:var(--accent);margin-top:2px}
.sp{display:block;font-style:italic;color:var(--muted);font-size:15px;margin-top:2px}
.tg{display:inline-block;background:var(--soft);color:var(--muted);border-radius:8px;padding:0 7px;margin-left:6px;font-size:12px;vertical-align:middle}
.node.open>.kids{display:block}
.node.leaf>.row{cursor:default}
.flash>.row{background:var(--soft);outline:2px solid var(--accent);outline-offset:-2px}
h2{font-size:15px;color:var(--muted);margin:6px 4px 8px;font-weight:600}
.res{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.bar{flex-wrap:wrap}.bar .btn{padding:10px 4px;font-size:14px}.bar .zb{flex:none;width:44px;font-size:20px;line-height:1;padding:8px 0}
.btn.main{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
#cp,#sp{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 30px}
#cp.on,#sp.on{display:block}
.cpi{max-width:900px;margin:0 auto}
.cpi h2{font-size:19px;color:var(--accent);margin:4px 0 10px}
.cpi label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
.cpi input,.cpi select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
.cr{display:flex;gap:8px}.cr>*{flex:1}
#cn{margin:8px 0;font-weight:700}
#ch{font-size:14px;color:var(--muted);margin:8px 0}
#cv{margin-top:10px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:70vh}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}body::before{display:none}body{background:#fff}#pa{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}.slice{break-after:page;page-break-after:always}.slice:last-child{break-after:auto;page-break-after:auto}.slice svg{width:100%;height:auto;display:block}}

.pk{font-weight:700;margin:6px 0;color:var(--accent)}
.vd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
.vd p{margin:6px 0;font-size:18px;line-height:1.4}.vd .st{color:var(--muted);font-size:14px;margin-top:8px}
.cg{display:grid;gap:16px 10px;margin-top:16px}
.cl{position:relative;min-width:0}
.cl::before{content:"";position:absolute;left:50%;top:-16px;height:16px;border-left:2px solid var(--guide)}
.lcaw{display:flex;justify-content:center}.lcaw .cl{max-width:75%}.lcaw .cl::before{display:none}
.cmpc{margin:0;width:100%;cursor:default;white-space:normal;align-items:flex-start}
.cmpc .nm{white-space:normal}
.endp{outline:2px solid var(--accent);outline-offset:-1px}
.tl{display:block;text-align:center;color:var(--onacc);font-size:14px;margin:-4px 0 9px;text-decoration:underline}
#vc{text-align:center;color:var(--muted);font-size:13px;padding:4px 0 28px}
</style>

const N=[];
(function(){const st=[];
for(const l of DATA.split('\n')){const m=l.match(/^(\d+)\.(\d+)\.\s*(.+)$/);if(!m)continue;
const g=+m[1];while(st.length&&N[st[st.length-1]].g>=g)st.pop();
const n={i:N.length,g,num:g+'.'+m[2],name:m[3],p:st.length?st[st.length-1]:-1,k:[],d:0};
if(n.p>=0)N[n.p].k.push(n.i);N.push(n);st.push(n.i);}
for(let i=N.length-1;i>=0;i--){const n=N[i];if(n.p>=0)N[n.p].d+=1+n.d;}
})();
function info(n){
  const nn=n.name.split(' ## '),parts=nn[0].split(' - ');let nm=parts[0],rest=parts.slice(1),tags=[],sp=[];
  const pm=nm.match(/^(.*?)\s*\((.*?)\)$/);if(pm){nm=pm[1];tags.push(pm[2])}
  if(nm==='Thủy Tổ'&&rest.length){tags.push('Thủy Tổ');nm=rest.shift()}
  const female=/\sThị\s/.test(nm);
  for(const r of rest){
    if(/^(Bính|Giáp|Tổ chi)/i.test(r)){tags.push(r);continue}
    const m=r.match(/^(.*?)\s*\((Vợ \d+)\)$/);
    sp.push(m?{l:m[2],n:m[1]}:{l:female?'Chồng':'Vợ',n:r});
  }
  return {nm,tags,sp,notes:nn.slice(1)};
}
const INFO=N.map(info);
const short=n=>INFO[n.i].nm;
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase();
const IDX=N.map(n=>fold(n.name));
const $=id=>document.getElementById(id),q=$('q'),tree=$('tree'),res=$('res');
const FLAT=9,IND=7;
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const EL=[];
function row(n){
  const f=INFO[n.i],b=h('button','row');
  b.append(h('span','mk',n.k.length?'▸':'·'),h('span','num',n.num));
  const nm=h('span','nm',f.nm);

  f.sp.forEach(x=>nm.append(h('span','sp',x.l+': '+x.n)));
  f.notes.forEach(x=>nm.append(h('span','nt',x)));
  b.append(nm);
  if(n.k.length)b.append(h('span','bd',n.d));
  return b;
}
function build(i){
  const n=N[i],d=h('div','node'+(n.k.length?'':' leaf'));
  EL[i]=d;if(n.g>FLAT){d.classList.add('tn');d.style.setProperty('--h',35+(n.g-FLAT-1)*22)}
  const r=row(n);d.append(r);
  if(n.k.length){
    const k=h('div','kids'+(n.g>=IND?' in':''));n.k.forEach(c=>k.append(build(c)));d.append(k);

}
function setOpen(i,o){const d=EL[i];d.classList.toggle('open',o);d.firstChild.firstChild.textContent=o?'▾':'▸'}
function openPath(i){for(let x=N[i].p;x>=0;x=N[x].p)setOpen(x,true)}
function collapse(){N.forEach(n=>{if(n.k.length)setOpen(n.i,false)});
  let x=0;setOpen(0,true);
  while(N[x].k.length){const c=N[x].k.reduce((a,b)=>N[b].d>N[a].d?b:a);if(x!==0&&N[x].k.length>=4)break;x=c;setOpen(x,true)}
  setOpen(x,true)}

function locate(i){

function search(v){
  const t=fold(v.trim());

  tree.style.display='none';res.style.display='block';res.innerHTML='';

function lines(i){const f=INFO[i];const nm=f.nm+(f.tags.length?' ('+f.tags.join(', ')+')':'');
  const a=wrap(nm,20).slice(0,3).map(t=>({t,s:'n'}));
  f.sp.forEach(x=>wrap(x.l+': '+x.n,22).slice(0,2).forEach(t=>a.push({t,s:'s'})));
  f.notes.forEach(x=>wrap(x,22).slice(0,2).forEach(t=>a.push({t,s:'s'})));
  return a.slice(0,4)}
function chart(r,G){
  const nodes=[],pos={};let leaf=0;
  (function go(i){const ks=vis(i,G);nodes.push(i);if(!ks.length){pos[i]=leaf++;return}ks.forEach(go);pos[i]=(pos[ks[0]]+pos[ks[ks.length-1]])/2})(r);
  const g0=N[r].g,H=nodes.map(i=>lines(i).length*LH+10),unit=Math.max(44,Math.max(...H)+10);
  const W=(G-g0)*COL+BW+20,cx=i=>10+(N[i].g-g0)*COL,cy=i=>pos[i]*unit+unit/2;
  let lk='',bx='';
  nodes.forEach((i,idx)=>{
    const ks=vis(i,G),n=N[i];
    if(ks.length){const x1=cx(i)+BW,xm=x1+(COL-BW)/2,ys=ks.map(cy);
      lk+=`M${x1} ${cy(i)}H${xm}M${xm} ${Math.min(...ys)}V${Math.max(...ys)}`+ks.map(k=>`M${xm} ${cy(k)}H${cx(k)}`).join('')}
    const h=H[idx],y=cy(i)-h/2,hue=35+(n.g-10)*22;
    const fill=n.g>9?`hsl(${hue},50%,90%)`:'#fffdf8',st=n.g>9?`hsl(${hue},38%,62%)`:'#b89a6a';
    bx+=`<rect x="${cx(i)}" y="${y}" width="${BW}" height="${h}" rx="6" fill="${fill}" stroke="${st}"/>`;
    lines(i).forEach((l,j)=>{bx+=`<text x="${cx(i)+7}" y="${y+2+LH*(j+1)}" font-size="${l.s==='n'?11:10.5}" `+(l.s==='n'?'font-weight="700"':'font-style="italic" fill="#6b5a46"')+`>${esc(l.t)}</text>`});
  });
  return {W,unit,leaf,g0,G,count:nodes.length,ctr:nodes.map(cy),hs:H,
    body:`<path d="${lk}" stroke="#a88a5c" fill="none" stroke-width="1.2"/><g fill="#2a2018">${bx}</g>`};
}
function hdr(c,y){let s='';for(let g=c.g0;g<=c.G;g++)s+=`<text x="${10+(g-c.g0)*COL}" y="${y}" font-size="12" font-weight="700" fill="#8c2f1b">Đời ${g}</text>`;return s}
function full(c,t){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${c.W} ${c.leaf*c.unit+60}" width="${c.W}" font-family="Georgia,serif"><text x="10" y="22" font-size="16" font-weight="700" fill="#8c2f1b">${esc(t)}</text>${hdr(c,48)}<svg x="0" y="60" width="${c.W}" height="${c.leaf*c.unit}" viewBox="0 0 ${c.W} ${c.leaf*c.unit}">${c.body}</svg></svg>`}
function breaks(c,paper){
  const [pw,ph]=PAPER[paper],W=Math.max(c.W,700),Hh=W*ph/pw,rpp=Math.max(1,Math.floor((Hh-60)/c.unit));
  const st=y=>c.ctr.some((v,i)=>v-c.hs[i]/2<y-.01&&v+c.hs[i]/2>y+.01);
  const out=[];let s=0;
  while(s<c.leaf){let e=Math.min(s+rpp,c.leaf);while(e>s+1&&e<c.leaf&&st(e*c.unit))e--;out.push([s,e]);s=e}
  return {out,W,Hh};
}
function slices(c,t,paper){
  const {out,W,Hh}=breaks(c,paper);
  return out.map(([s,e],k)=>{const hh=(e-s)*c.unit;
    return `<div class="slice"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" font-family="Georgia,serif"><text x="10" y="22" font-size="16" font-weight="700" fill="#8c2f1b">${esc(t)}${out.length>1?' — trang '+(k+1)+'/'+out.length:''}</text>${hdr(c,48)}<svg x="0" y="60" width="${W}" height="${hh}" viewBox="0 ${s*c.unit} ${W} ${hh}">${c.body}</svg></svg></div>`});
}
let cr=N.findIndex(n=>INFO[n.i].tags.some(x=>/tổ chi bính/i.test(x)));if(cr<0)cr=0;
let cc=null,ctitle='';
function fillGen(){const mx=maxSub(cr),s=$('cg');s.innerHTML='';for(let g=N[cr].g;g<=mx;g++){const o=h('option',null,'Đời '+g);o.value=g;s.append(o)}s.value=Math.min(N[cr].g+4,mx)}
function draw(){
  const G=+$('cg').value;cc=chart(cr,G);
  ctitle='Đặng Tộc Gia Phả Ký · từ '+INFO[cr].nm+' (đời '+N[cr].g+') đến đời '+G;
  $('cn').textContent='Đang vẽ từ: '+N[cr].num+' '+INFO[cr].nm;
  $('cv').innerHTML=full(cc,ctitle);
  const p=$('cs').value,{out,W}=breaks(cc,p),pt=11*(PAPER[p][0]/W)*2.835;
  $('ch').textContent=cc.count+' người · '+out.length+' trang · cỡ chữ in ≈ '+pt.toFixed(1)+' pt'+(pt<6?' (chữ nhỏ, nên vẽ ít đời hơn hoặc chọn giấy lớn hơn)':'');
}
$('dr').onclick=()=>{$('cp').classList.add('on');if(!$('cg').options.length)fillGen();draw()};
$('cx').onclick=()=>$('cp').classList.remove('on');
$('cg').onchange=draw;$('cs').onchange=draw;
$('cq').oninput=e=>{const t=fold(e.target.value.trim()),l=$('cl');l.innerHTML='';if(t.length<2)return;let k=0;
  for(let i=0;i<N.length&&k<8;i++)if(IDX[i].includes(t)&&N[i].k.length){k++;
    const b=h('button','btn',N[i].num+' '+INFO[i].nm+(N[i].p>=0?' · cha: '+INFO[N[i].p].nm:''));
    b.style.cssText='display:block;width:100%;text-align:left;margin:4px 0';
    b.onclick=()=>{cr=i;l.innerHTML='';$('cq').value='';fillGen();draw()};l.append(b)}};
$('cpdf').onclick=()=>{const p=$('cs').value,a=p.split(' ');const D={A4:[210,297],A3:[297,420],A2:[420,594],A1:[594,841],A0:[841,1189]};let [w,hh]=D[a[0]];if(a[1]==='landscape')[w,hh]=[hh,w];$('pg').textContent='@page{size:'+w+'mm '+hh+'mm;margin:10mm}';$('pa').innerHTML=slices(cc,ctitle,p).join('');setTimeout(()=>window.print(),150)};
addEventListener('afterprint',()=>{$('pa').innerHTML=''});

const NM=i=>INFO[i].nm,FEM=i=>/\sThị\s/.test(INFO[i].nm);
const anc=i=>{const a=[];for(let x=i;x>=0;x=N[x].p)a.unshift(x);return a};
function role(x,y,dx,dy,cx,cy,lca){
  const f=FEM(x),K=N[lca].k;
  if(dx===dy){const el=K.indexOf(cx)<K.indexOf(cy);let b=el?(f?'chị':'anh'):'em';if(dx>=2)b+=' họ';return b}
  if(dx<dy){
    const d=dy-dx;
    if(dx===0){const T=[0,f?'mẹ':'cha',f?'bà (nội)':'ông (nội)',f?'cụ bà':'cụ ông','kỵ'];return d<=4?T[d]:'tổ trên '+d+' đời'}
    if(d>4)return 'bậc trên '+d+' đời';
    const el=K.indexOf(cx)<K.indexOf(cy);
    const P={1:['bác','chú','cô'],2:['ông bác','ông chú','bà cô'],3:['cụ bác','cụ chú','cụ cô'],4:['kỵ bác','kỵ chú','kỵ cô']}[d];
    const r=el?(f&&d===2?'bà bác':P[0]):(f?P[2]:P[1]);
    return dx>=2?r+' họ':r;
  }
  const d=dx-dy;
  if(dy===0){const T=[0,'con','cháu nội','chắt','chút','chít'];return d<=5?T[d]:'hậu duệ đời thứ '+d}
  return dy>=2?'cháu họ':'cháu';
}
function relInfo(a,b){
  const pa=anc(a),pb=anc(b);let k=0;while(k<pa.length&&k<pb.length&&pa[k]===pb[k])k++;
  const lca=pa[k-1],da=pa.length-k,db=pb.length-k,ca=da?pa[k]:-1,cb=db?pb[k]:-1;
  return {pa,pb,k,lca,da,db,ca,cb,rAB:role(a,b,da,db,ca,cb,lca),rBA:role(b,a,db,da,cb,ca,lca)};
}
let sa=-1,sb=-1;
function cell(i,end,tag,label){
  const w=h('div','cl'+(N[i].g>9?' tn':''));if(N[i].g>9)w.style.setProperty('--h',35+(N[i].g-10)*22);
  const r=h('div','row cmpc'+(end?' endp':''));
  r.append(h('span','num',N[i].num));
  const nm=h('span','nm',NM(i));nm.append(h('small',null,'Đời '+N[i].g+(label?' · '+label:'')));
  r.append(nm);if(tag)r.append(h('span','bd',tag));
  w.append(r);return w;
}
function cmp(){
  $('p1').textContent=sa>=0?'① '+N[sa].num+' '+NM(sa)+' (đời '+N[sa].g+')':'';
  $('p2').textContent=sb>=0?'② '+N[sb].num+' '+NM(sb)+' (đời '+N[sb].g+')':'';
  const o=$('so');o.innerHTML='';
  if(sa<0||sb<0)return;
  if(sa===sb){o.append(h('div','empty','Hai ô đang chọn là cùng một người.'));return}
  const R=relInfo(sa,sb),{lca,da,db,k}=R;
  const v=h('div','vd');
  const p1=h('p');p1.append(h('b',null,NM(sa)),document.createTextNode(' là '),h('b',null,R.rAB),document.createTextNode(' của '),h('b',null,NM(sb)),document.createTextNode('.'));
  const p2=h('p');p2.append(h('b',null,NM(sb)),document.createTextNode(' là '),h('b',null,R.rBA),document.createTextNode(' của '),h('b',null,NM(sa)),document.createTextNode('.'));
  v.append(p1,p2);
  let st='Tổ chung gần nhất: '+N[lca].num+' '+NM(lca)+' (đời '+N[lca].g+')';
  if(da===0)st='Ông '+NM(sa)+' chính là tổ của '+NM(sb);else if(db===0)st='Ông '+NM(sb)+' chính là tổ của '+NM(sa);
  st+='. ① cách tổ chung '+da+' đời, ② cách '+db+' đời. ';
  st+=da===db?'Ngang vai vế (cùng đời '+N[sa].g+').':NM(da<db?sa:sb)+' ở bậc trên '+NM(da<db?sb:sa)+' '+Math.abs(da-db)+' đời.';
  v.append(h('div','st',st));
  v.append(h('div','st','Xưng hô tính theo phả hệ nội tộc. Anh/em xác định theo thứ tự trong gia phả (số nhỏ là lớn tuổi hơn); giới tính suy từ tên (có “Thị” là nữ).'));
  o.append(v);
  const A=R.pa.slice(k),B=R.pb.slice(k),two=A.length&&B.length;
  const lw=h('div','lcaw');lw.append(cell(lca,true,da===0?'①':db===0?'②':'',da===0||db===0?'':'tổ chung'));o.append(lw);
  const g=h('div','cg');g.style.gridTemplateColumns=two?'minmax(0,1fr) minmax(0,1fr)':'minmax(0,420px)';g.style.justifyContent=two?'stretch':'center';
  const K=N[lca].k,elA=two&&K.indexOf(R.ca)<K.indexOf(R.cb);
  const n=Math.max(A.length,B.length);
  const mk=(arr,tag,r,lab)=>r<arr.length?cell(arr[r],r===arr.length-1,r===arr.length-1?tag:'',r===0&&two?lab:''):h('div');
  for(let r=0;r<n;r++){
    if(A.length)g.append(mk(A,'①',r,elA?'nhánh anh':'nhánh em'));
    if(B.length)g.append(mk(B,'②',r,elA?'nhánh em':'nhánh anh'));
  }
  o.append(g);
}
function pick(inp,list,which){
  $(inp).oninput=e=>{const t=fold(e.target.value.trim()),l=$(list);l.innerHTML='';if(t.length<2)return;let c=0;
    for(let i=0;i<N.length&&c<8;i++)if(IDX[i].includes(t)){c++;
      const b=h('button','btn',N[i].num+' '+NM(i)+(N[i].p>=0?' · cha: '+NM(N[i].p):''));
      b.style.cssText='display:block;width:100%;text-align:left;margin:4px 0';
      b.onclick=()=>{if(which===1)sa=i;else sb=i;l.innerHTML='';$(inp).value='';cmp()};l.append(b)}};
}
pick('s1','l1',1);pick('s2','l2',2);
$('sb').onclick=()=>$('sp').classList.add('on');
$('sx').onclick=()=>$('sp').classList.remove('on');
$('sw').onclick=()=>{[sa,sb]=[sb,sa];cmp()};

(function(){
  const el=document.getElementById('vc'),base='https://api.counterapi.dev/v1/dinhsuc-giapha-binhtam/visits';
  let inc=true;
  try{const t=+localStorage.getItem('gp_visit');if(t&&Date.now()-t<30*60*1000)inc=false}catch(e){}
  fetch(inc?base+'/up':base+'/').then(r=>r.json()).then(d=>{
    const n=d.count!=null?d.count:d.value;if(n==null)return;
    el.textContent='Lượt truy cập: '+Number(n).toLocaleString('vi-VN');
    if(inc){try{localStorage.setItem('gp_visit',String(Date.now()))}catch(e){}}
  }).catch(()=>{});
})();
</script>
